<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Collaborative Code Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/cursors.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                <span>Documents</span>
            </div>
            <div class="doc-list" id="doc-list">
                <!-- Dynamically populated doc list -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main id="workspace">
            <!-- Header -->
            <header id="header">
                <input type="text" id="doc-title" class="doc-title-input" value="Untitled Document">
                
                <div class="presence-bar">
                    <div id="avatar-container" style="display: flex; gap: 4px;"></div>
                    
                    <div class="status-badge">
                        <div class="status-dot" id="status-dot"></div>
                        <span id="status-text">Connected</span>
                    </div>
                </div>
            </header>

            <!-- Code Editor Container -->
            <div id="editor-container">
                <div class="line-numbers" id="line-numbers">1</div>
                <textarea id="code-editor" placeholder="Start typing code..." spellcheck="false"></textarea>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="wasm/ot_engine.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
