<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Collaborative Code Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/cursors.css">
    <link rel="stylesheet" href="css/syntax.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-info">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    <span class="sidebar-title-text">Documents</span>
                </div>
                <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="Toggle Sidebar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                </button>
            </div>
            <div class="doc-list" id="doc-list">
            </div>

            <!-- User Profile Component (Anchored at Bottom Left) -->
            <div class="user-profile" id="user-profile">
                <div class="user-profile-avatar" id="user-profile-avatar">A</div>
                <div class="user-profile-details">
                    <span class="user-profile-name" id="user-profile-name">User</span>
                    <span class="user-profile-status">
                        <span class="status-dot" style="width: 6px; height: 6px;"></span> Active
                    </span>
                </div>
            </div>

            <!-- Sidebar Resize Handle -->
            <div id="sidebar-resizer"></div>
        </aside>
        <main id="workspace">
            <header id="header">
                <input type="text" id="doc-title" class="doc-title-input" value="Untitled Document">
                <div class="presence-bar">
                    <button id="history-btn" style="background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">History</button>
                    <div id="avatar-container" style="display: flex; gap: 4px;"></div>
                    <div class="status-badge">
                        <div class="status-dot" id="status-dot"></div>
                        <span id="status-text">Connected</span>
                    </div>
                </div>
            </header>
            <div id="editor-container">
                <div class="line-numbers" id="line-numbers">1</div>
                <textarea id="code-editor" placeholder="Start typing code..." spellcheck="false"></textarea>
            </div>
        </main>
    </div>
    <div id="history-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center;">
        <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; width: 600px; max-width: 90vw; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-size: 1.1rem;">Document History Replay</h3>
                <button id="close-history-btn" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem;">&times;</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-secondary);">
                    <span>Time Slider</span>
                    <span id="history-rev-label">Revision 0 / 0</span>
                </div>
                <input type="range" id="history-slider" min="0" max="0" value="0" style="width: 100%; cursor: pointer;">
                <div id="history-meta-info" style="font-size: 0.82rem; color: var(--accent-blue); font-weight: 500;">Initial Creation</div>
            </div>
            <pre id="history-text-preview" style="background: var(--bg-primary); border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.9rem; max-height: 300px; overflow-y: auto; white-space: pre-wrap; color: var(--text-primary);"></pre>
        </div>
    </div>
    <script src="wasm/ot_engine.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
